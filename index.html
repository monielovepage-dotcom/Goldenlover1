<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12315f;--muted:#5d6f8c;--blue:#1b7fe3;--blue-d:#1565bd;--cream:#ecdc94;--cream-d:#cdbb6a;--pink:#f08aad;--pink-d:#d9638a;--tilt:.6deg}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Mali","Sarabun",system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;
  background:radial-gradient(circle at 20% 10%,#fff 0,transparent 38%),radial-gradient(circle at 85% 80%,#e6f1ff 0,transparent 45%),linear-gradient(180deg,#b9d8f6,#f3f8ff 75%);
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-x:hidden}
.card{position:relative;width:min(100%,400px);padding:26px 22px 24px;border-radius:34px;text-align:center;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 22px 50px rgba(40,90,150,.22),inset 0 0 0 1.5px rgba(255,255,255,.95);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 0,transparent 0 14px,rgba(120,170,230,.08) 14px 15px)}
.card>*{position:relative}
.badge{display:inline-block;padding:5px 13px;border-radius:99px;background:#d3e6fb;color:var(--blue-d);
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.frame{position:relative;width:min(64%,240px);aspect-ratio:1/1;margin:14px auto 4px;border-radius:24px;
  background:radial-gradient(circle at 25% 20%,#fff 0,transparent 45%),linear-gradient(160deg,#eef6ff,#cfe4fa);
  box-shadow:0 8px 20px rgba(40,90,150,.18),inset 0 0 0 5px rgba(255,255,255,.88);overflow:hidden}
.frame img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:cover;border-radius:18px;opacity:0;transition:opacity .4s}
.frame img.on{opacity:1}
.spark{position:absolute;top:7px;left:0;right:0;padding-left:.7em;font-size:9px;color:#fff;letter-spacing:.7em;text-shadow:0 0 5px #6fa9ea;z-index:2}
h1{font-size:29px;line-height:1.3;font-weight:700;margin:14px 0 8px}
.sub{font-size:13px;line-height:1.7;color:var(--muted)}
.actions{position:relative;height:120px;margin-top:14px}
.btn{position:absolute;border:0;font:inherit;font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;cursor:pointer;white-space:nowrap;
  transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1),transform .2s}
.btn:focus-visible{outline:3px solid #12315f;outline-offset:3px}
.yes{left:0;top:32px;background:linear-gradient(var(--blue),var(--blue-d));color:#fff;transform:rotate(calc(var(--tilt) * -1));
  box-shadow:0 5px 0 #0f4f95,0 10px 18px rgba(21,101,189,.35)}
.no{left:0;top:32px;background:linear-gradient(#f4e8ab,var(--cream));color:#6b5a1c;transform:rotate(var(--tilt));z-index:2;
  box-shadow:0 5px 0 var(--cream-d),0 10px 16px rgba(120,100,20,.22)}
.pink{position:relative;width:100%;margin-top:14px;background:linear-gradient(var(--pink),var(--pink-d));color:#fff;
  box-shadow:0 5px 0 #b94a72,0 10px 18px rgba(217,99,138,.35)}
.pink:active{transform:translateY(3px);box-shadow:0 2px 0 #b94a72}
.note{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(190,220,250,.45);font-size:13px;line-height:1.7}
.ln{white-space:nowrap}
.bubble{min-height:22px;margin-top:10px;font-size:12px;font-weight:600;color:var(--blue-d);opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}
.contact{position:relative;display:block;width:100%;margin-top:12px;text-align:center;text-decoration:none;color:#fff;
  background:linear-gradient(var(--blue),var(--blue-d));box-shadow:0 5px 0 #0f4f95,0 10px 18px rgba(21,101,189,.35)}
.contact[hidden]{display:none}
.shot{margin-top:14px;font-size:13px;color:var(--muted)}
.fade{transition:opacity .3s}
.fade.out{opacity:0}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.h{position:absolute;line-height:1;animation:pop var(--d,3s) ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}
#beg{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.beg{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));border:0;border-radius:999px;font:inherit;font-weight:700;
  white-space:nowrap;max-width:92vw;padding:.65em 1.1em;cursor:pointer;pointer-events:auto;
  box-shadow:0 4px 0 rgba(0,0,0,.14),0 8px 14px rgba(40,90,150,.2);
  animation:begIn .35s cubic-bezier(.3,1.6,.5,1) both;transition:opacity .3s,scale .3s}
.beg:focus-visible{outline:3px solid #12315f;outline-offset:2px}
.beg.out{opacity:0;scale:.2}
@keyframes begIn{from{transform:translate(-50%,-50%) rotate(var(--r)) scale(0)}to{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.h{animation-duration:1.2s}.beg{animation:none}}
</style>
</head>
<body>

<main class="card" id="card">
  <span class="badge" id="badge"></span>
  <div class="frame" id="frame"><div class="spark">✦ ♡ ✦ ♡ ✦</div></div>

  <section id="ask" class="fade">
    <h1 id="q"></h1>
    <p class="sub" id="sub"></p>
    <p class="bubble" id="bubble" aria-live="polite"></p>
    <div class="actions" id="actions">
      <button class="btn yes" id="yes" type="button"></button>
      <button class="btn no" id="no" type="button"></button>
    </div>
  </section>

  <section id="done" class="fade out" hidden>
    <h1 id="wt"></h1>
    <div class="note" id="w1"></div>
    <div class="note" id="w2"></div>
    <p class="shot" id="w3"></p>
    <p class="shot" id="sign" hidden></p>
    <a class="btn contact" id="contact" target="_blank" rel="noopener" hidden></a>
    <button class="btn pink" id="burst" type="button"></button>
  </section>
</main>
<div id="hearts" aria-hidden="true"></div>

<script>
/* ============================================================
   CONFIG  -  แก้ข้อความ / รูปตัวละครได้ที่นี่ที่เดียว
   ------------------------------------------------------------
   images: ใส่พาธรูปตัวละคร (PNG โปร่งใส / GIF / JPG) ได้เลย
     start    = รูปตอนเปิดหน้าแรก (ใช้รูปแรกในลิสต์)
     dodging  = รูปที่สลับไปเรื่อย ๆ ทุกครั้งที่ปุ่มวิ่งหนี (วนซ้ำ)
     win      = รูปตอนกดตกลง (วนซ้ำ)
   ถ้าเว้นว่างไว้ กรอบรูปจะแสดงเป็นกรอบสวย ๆ เปล่า ๆ ไม่มีรูปแตก
   fit: "cover" (เหมาะกับรูปถ่ายเต็มกรอบ) หรือ "contain" (เหมาะกับ PNG โปร่งใส)
   ============================================================ */
const CONFIG = {
  pageTitle: "Love Mission",
  badge: "LOVE MISSION : พี่สาวคนสวย",

  question: "ผมขอจีบพี่สาวคนสวยได้ไหม?",
  subtitle: "หมาน้อยคนนี้แอบมองพี่สาวมานานแล้วนะ…\nขอให้ผมได้เข้าใกล้พี่หน่อยนะครับ 💙",
  yesText: "ให้ผมจีบได้นะ",
  noText: "เป็นน้องชายกันก่อนนะ",

  win: {
    title: "เย้! พี่สาวให้จีบแล้ว 💙",
    line1: "ภารกิจจีบพี่สาวคนสวยของผมผ่านด่านแรกแล้ว!\nต่อจากนี้ขอให้มีแต่เรื่องน่ารัก ๆ ระหว่างเรา",
    line2: "ผมอาจเป็นแค่หมาเด็กตัวน้อย ๆ…\nแต่ผมจะตั้งใจทำให้พี่ยิ้มได้ทุกวันเลย",
    screenshot: "แคปหน้าจอนี้แล้วส่งกลับมาหาผมได้นะครับ 📷",
    burstText: "ปล่อยหัวใจให้พี่สาวเลย! 💛"
  },

  images: {
    fit: "cover",
    // pup1-pup4 = รูปลูกหมา 4 รูปที่ฝังไว้ท้ายไฟล์ (สลับชื่อได้เลย)
    // หรือใส่พาธรูปของตัวเองแทนก็ได้ เช่น "img/happy.png"
    start:   ["pup1"],
    dodging: ["pup3", "pup4"],
    win:     ["pup2", "pup1"]
  },

  // ข้อความเด้งใต้คำอธิบาย ทุกครั้งที่ปุ่มวิ่งหนี (ลบทิ้งทั้งหมด = ไม่แสดง)
  dodgeMessages: [
    "จับไม่ได้หรอก 😜",
    "พี่สาวกดปุ่มน้ำเงินเถอะน้า 🥺",
    "ผมรู้นะว่าพี่สาวอยากกด 💙",
    "ใจแข็งไม่ได้นะพี่สาว 😭",
    "ปุ่มนี้เขินแล้วนะ 🙈"
  ],

  // ลายเซ็นท้ายฉากสำเร็จ เช่น "จาก น้องมิ้นต์ 💙" (เว้นว่าง "" = ไม่แสดง)
  signature: "",

  // ปุ่มติดต่อหลังพี่กดตกลง ใส่ลิงก์ LINE / IG ได้ เช่น "https://line.me/ti/p/xxxx"
  // (เว้นว่าง url = ไม่แสดงปุ่ม)
  contact: { text: "ส่งข้อความหาผม 💬", url: "" },

  // ปุ่มอ้อนที่ผุดขึ้นทีละปุ่มทุกครั้งที่ชี้/แตะปุ่ม "เป็นน้องชายกันก่อนนะ" จนเต็มจอ
  // กดปุ่มไหนก็เท่ากับกดตกลง (ลบ texts ทิ้งทั้งหมด = ปิดฟีเจอร์นี้)
  // every = ผุดทุก ๆ กี่ครั้งที่ปุ่มหนี (1 = ทุกครั้ง, เลขยิ่งมาก เต็มจอช้าลง)
  please: {
    every: 1,
    texts: [
      "ได้โปรดนะ 🥺", "นะ นะ นะ 🥹", "ให้จีบเถอะน้า", "ผมขอร้อง 😭",
      "พี่สาวครับ 💙", "ใจอ่อนหน่อยนะ", "ขอโอกาสนะ 🙏", "หมาน้อยน่ารักนะ ✨",
      "อย่าปฏิเสธเลย 🥺", "อยู่ข้างกันนะ 💗"
    ]
  },

  dodge: { nearPx: 80 }       // ระยะที่เมาส์เข้าใกล้ปุ่มแล้วปุ่มเริ่มหนี (px)
};

/* ======================= ส่วนการทำงาน ======================= */
const $ = id => document.getElementById(id);
const card = $("card"), frame = $("frame"), actions = $("actions"), yes = $("yes"), no = $("no");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* แต่ละบรรทัด (\n) อยู่บรรทัดเดียวเสมอ ถ้ายาวเกินจะย่อขนาดตัวอักษรให้พอดีกรอบ */
function setLines(el, text) {
  el.textContent = "";
  String(text).split("\n").forEach(t => {
    const d = document.createElement("div");
    d.className = "ln";
    d.textContent = t;
    el.appendChild(d);
  });
}
function fit(el, max, min) {
  const ls = [...el.querySelectorAll(".ln")];
  let sz = max;
  el.style.fontSize = sz + "px";
  while (sz > min && ls.some(l => l.scrollWidth > l.clientWidth + 1)) {
    sz -= .5;
    el.style.fontSize = sz + "px";
  }
}
function fitAsk()  { fit($("q"), 29, 15); fit($("sub"), 13, 9); }
function fitDone() { fit($("wt"), 29, 15); fit($("w1"), 13, 9); fit($("w2"), 13, 9); fit($("w3"), 13, 9); fit($("sign"), 13, 9); }
function fitAll()  { fitAsk(); if (!$("done").hidden) fitDone(); }
addEventListener("resize", fitAll);
document.fonts && document.fonts.ready.then(fitAll);

const clean = a => (a || []).filter(Boolean);

document.title = CONFIG.pageTitle;
$("badge").textContent = CONFIG.badge;
setLines($("q"), CONFIG.question);
setLines($("sub"), CONFIG.subtitle);
yes.innerHTML = '<span style="color:#ffd84d">♥</span> ';
yes.append(CONFIG.yesText);
no.textContent = CONFIG.noText;
setLines($("wt"), CONFIG.win.title);
setLines($("w1"), CONFIG.win.line1);
setLines($("w2"), CONFIG.win.line2);
setLines($("w3"), CONFIG.win.screenshot);
$("burst").textContent = CONFIG.win.burstText;
if (CONFIG.signature) { setLines($("sign"), CONFIG.signature); $("sign").hidden = false; }
if (CONFIG.contact && CONFIG.contact.url) {
  const c = $("contact");
  c.textContent = CONFIG.contact.text;
  c.href = CONFIG.contact.url;
  c.hidden = false;
}
frame.style.setProperty("--fit", CONFIG.images.fit);

/* ---------- รูปตัวละคร (ว่างได้) ---------- */
function showImage(src) {
  src = (window.PHOTOS || {})[src] || src;
  frame.querySelectorAll("img.on").forEach(old => {
    old.classList.remove("on");
    setTimeout(() => old.remove(), 450);
  });
  if (!src) return;
  const img = new Image();
  img.alt = "";
  img.style.objectFit = CONFIG.images.fit;
  img.onload = () => { frame.appendChild(img); requestAnimationFrame(() => img.classList.add("on")); };
  img.onerror = () => {};      // รูปหาย = ไม่แสดงอะไร ไม่ให้เห็นไอคอนรูปแตก
  img.src = src;
}
let dodgeIdx = 0, winIdx = 0;
addEventListener("DOMContentLoaded", () => { showImage(clean(CONFIG.images.start)[0]); fitAll(); });

/* ---------- ข้อความเด้งตอนปุ่มหนี ---------- */
let msgIdx = 0;
function say() {
  const m = CONFIG.dodgeMessages || [];
  if (!m.length) return;
  const b = $("bubble");
  setLines(b, m[msgIdx++ % m.length]);
  fit(b, 12, 9);
  b.classList.add("on");
}

/* ---------- ปุ่มวิ่งหนี ---------- */
let curX = 0, curY = 0, lastDodge = 0;
function place(x, y) {
  curX = x; curY = y;
  no.style.left = x + "px";
  no.style.top = y + "px";
}
function home() {
  place(actions.clientWidth - no.offsetWidth, 32);
}
function dodge() {
  const now = Date.now();
  if (now - lastDodge < 220) return;
  lastDodge = now;
  const W = actions.clientWidth - no.offsetWidth;
  const H = actions.clientHeight - no.offsetHeight;
  let x, y, t = 0;
  do { x = Math.random() * W; y = Math.random() * H; t++; }
  while (t < 14 && Math.hypot(x - curX, y - curY) < 70);
  place(x, y);
  say();
  spawnBeg();
  const imgs = clean(CONFIG.images.dodging);
  if (imgs.length) showImage(imgs[dodgeIdx++ % imgs.length]);
}
no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(); });
no.addEventListener("touchstart", e => { e.preventDefault(); dodge(); }, { passive: false });
no.addEventListener("click", e => { e.preventDefault(); dodge(); });
actions.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const r = no.getBoundingClientRect();
  const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  if (d < r.width / 2 + CONFIG.dodge.nearPx) dodge();
});
addEventListener("resize", home);
document.fonts && document.fonts.ready.then(home);
home();

/* ---------- ปุ่มอ้อน เพิ่มขึ้นเรื่อย ๆ จนเต็มจอ ---------- */
const begLayer = document.createElement("div");
begLayer.id = "beg";
document.body.appendChild(begLayer);
const BEG_COLORS = [["#f08aad", "#fff"], ["#bcdcff", "#12315f"], ["#f4e8ab", "#6b5a1c"],
                    ["#d7c8f7", "#3f2d73"], ["#bdecd6", "#1d5a43"], ["#1b7fe3", "#fff"]];
let begCells = null, begN = 0, begTick = 0;
function begInit() {
  const narrow = innerWidth < 600, cols = narrow ? 4 : 8, rows = narrow ? 8 : 5, cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ c, r, cols, rows });
  for (let i = cells.length - 1; i > 0; i--) {          // สุ่มลำดับช่อง
    const j = Math.random() * (i + 1) | 0;
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  begCells = cells;
}
function spawnBeg() {
  const cfg = CONFIG.please || {}, texts = cfg.texts || [];
  if (!texts.length || celebrated) return;
  if (++begTick % (cfg.every || 1)) return;
  if (!begCells) begInit();
  if (begN >= begCells.length) return;                  // เต็มจอแล้ว
  const cell = begCells[begN];
  const t = begN / begCells.length;                     // 0 -> 1 ยิ่งมาก ปุ่มยิ่งใหญ่
  const col = BEG_COLORS[begN % BEG_COLORS.length];
  const b = document.createElement("button");
  b.type = "button";
  b.className = "beg";
  b.textContent = texts[begN % texts.length];
  b.style.cssText = `left:${(cell.c + .5 + (Math.random() - .5) * .5) / cell.cols * 100}%;` +
    `top:${(cell.r + .5 + (Math.random() - .5) * .5) / cell.rows * 100}%;` +
    `font-size:${(14 + t * 14).toFixed(1)}px;background:${col[0]};color:${col[1]};--r:${((Math.random() - .5) * 14).toFixed(1)}deg`;
  b.addEventListener("click", celebrate);
  begLayer.appendChild(b);
  begN++;
}
function clearBeg() {
  begLayer.querySelectorAll(".beg").forEach(b => { b.classList.add("out"); setTimeout(() => b.remove(), 350); });
}

/* ---------- หัวใจลอย ---------- */
const COLORS = ["#ff7fa8", "#f25c8a", "#8fc4ff", "#ffd84d", "#ffb3c9"];
function heart(x, y, dx, dy, size, dur) {
  const h = document.createElement("span");
  h.className = "h";
  h.textContent = "♥";
  h.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${COLORS[Math.random() * COLORS.length | 0]};` +
    `--dx:${dx}px;--dy:${dy}px;--rot:${(Math.random() - .5) * 80}deg;--d:${dur}s`;
  h.addEventListener("animationend", () => h.remove());
  $("hearts").appendChild(h);
}
function rain(n) {
  for (let i = 0; i < n; i++) {
    setTimeout(() => heart(Math.random() * innerWidth, innerHeight + 20,
      (Math.random() - .5) * 120, -(innerHeight * (.5 + Math.random() * .6)),
      12 + Math.random() * 18, 3 + Math.random() * 2.5), i * 70);
  }
}
function burstFrom(el) {
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 26; i++) {
    heart(cx, cy, (Math.random() - .5) * 320, -(80 + Math.random() * 240), 12 + Math.random() * 18, 1.6 + Math.random() * 1.2);
  }
}

/* ---------- ฉากสำเร็จ ---------- */
let celebrated = false;
function celebrate() {
  if (celebrated) return;
  celebrated = true;
  clearBeg();
  $("ask").classList.add("out");
  setTimeout(() => {
    $("ask").hidden = true;
    const d = $("done");
    d.hidden = false;
    fitDone();
    requestAnimationFrame(() => d.classList.remove("out"));
    const imgs = clean(CONFIG.images.win);
    showImage(imgs.length ? imgs[winIdx++ % imgs.length] : "");
    rain(reduce ? 8 : 40);
    if (!reduce) setInterval(() => rain(3), 900);
  }, 320);
}
yes.addEventListener("click", celebrate);
$("burst").addEventListener("click", e => {
  burstFrom(e.currentTarget);
  const imgs = clean(CONFIG.images.win);
  if (imgs.length > 1) showImage(imgs[winIdx++ % imgs.length]);
});
</script>
<script>
